# Cloudflare Worker serving every preview site from this repo's static files: https://<slug>-preview.wavefrontlabs.dev -> sites/<slug>/.
# Single-level hostnames on purpose: the zone's universal certificate covers *.wavefrontlabs.dev but not *.sites.wavefrontlabs.dev.
# DNS is one proxied wildcard record (* AAAA 100::); the route below picks up only the -preview hosts.
# Deployed by sitesmith/publish.py (npx wrangler deploy) after each push. Always on, free at this scale.
name = "sitesmith-sites"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = false
routes = [{ pattern = "*-preview.wavefrontlabs.dev/*", zone_name = "wavefrontlabs.dev" }]

[assets]
directory = "./sites"   # only the site folders (plus sites/404.html) are uploaded; repo files stay out
binding = "ASSETS"
run_worker_first = true   # the Worker owns /edit and /api/* on every site; everything else falls through to the static files

# owner-editable data: menu:<slug> (JSON the site renders live), token:<slug>:<token> (magic-link sessions, 60 days)
[[kv_namespaces]]
binding = "SITEDATA"
id = "de9756f44ec94868ae55b94c0348f14d"
